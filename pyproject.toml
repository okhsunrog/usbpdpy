[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "usbpdpy"
description = "Python bindings for USB Power Delivery protocol message parsing"
dynamic = ["version"]
authors = [
    {name = "Danila Gornushko", email = "me@okhsunrog.dev"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research", 
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["usb", "usb-pd", "power-delivery", "protocol", "parsing", "hardware"]
dependencies = []

[project.urls]
Homepage = "https://github.com/okhsunrog/usbpdpy"
Repository = "https://github.com/okhsunrog/usbpdpy"
Issues = "https://github.com/okhsunrog/usbpdpy/issues"
Documentation = "https://github.com/okhsunrog/usbpdpy#readme"

[tool.maturin]
module-name = "usbpdpy"

[tool.uv]
# uv reinstalls this project from its build cache on every `uv run`, and by
# default only pyproject.toml invalidates that cache. Without the Rust sources
# listed here, `uv run pytest` silently tests a stale build of the extension.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
